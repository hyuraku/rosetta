name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v -o rosetta main.go

      - name: Run tests
        run: go test -v -race -timeout=10m -coverprofile=coverage.txt -covermode=atomic ./...

  # Lint job
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml is v2 format; pin the same version used locally
          # so "green locally, red in CI" cannot happen.
          version: v2.10.1

  # Dependabot の PR を、上の CI ジョブがすべて通ったあとに条件付きでマージする。
  # needs で CI の成功を前提にしているので、ブランチ保護（無料プランの private repo では使えない）に頼らない。
  # 自動マージする条件:
  #   - patch: version update / security update のどちらも
  #   - minor: version update のグループ（minor-and-patch）だけ
  # major と、minor を含む security update は人がレビューする。
  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [build-and-test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Squash-merge eligible updates
        id: merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.dependency-group == 'minor-and-patch' &&
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
